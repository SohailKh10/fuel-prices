name: Update news
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-news
  cancel-in-progress: false
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch news
        run: python scripts/fetch_news.py
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain news.json)" ]; then
            git config user.name "liveratespk-bot"
            git config user.email "actions@users.noreply.github.com"
            git add news.json
            git commit -m "Update news.json"
            git pull --rebase --autostash
            git push
          else
            echo "no changes"
          fi
