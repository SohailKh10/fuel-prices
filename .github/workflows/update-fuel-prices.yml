name: Update Pakistan Fuel Prices

on:
  schedule:
    # GitHub cron is UTC. Pakistan is UTC+5.
    - cron: '0 19 * * *'    # 12:00 AM PKT — catches a new date / midnight publish
    - cron: '0 4 * * *'     # 09:00 AM PKT — catches the usual morning publish
    - cron: '0 9 * * *'     # 02:00 PM PKT — safety net for a late revision
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fuel-prices-update
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run fuel scraper
        run: python scrape.py

      - name: Run metals scraper
        run: python scrape_metals.py
        continue-on-error: true

      - name: Build the phone-widget feed
        run: python build_widget_json.py
        continue-on-error: true

      - name: Commit and push if anything changed
        run: |
          git config user.name "fuel-price-bot"
          git config user.email "actions@github.com"

          # The scrapers create rates.json, octane.json,
          # lpg.json, metals-history.json and widget.json.
          # Stage each file only if it exists.
          for f in rates.json octane.json lpg.json metals-history.json widget.json; do
            if [ -f "$f" ]; then
              git add "$f"
            else
              echo "note: $f not present, skipping."
            fi
          done

          # Check whether there is anything new to commit.
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          # Use Pakistan date instead of UTC for the commit message.
          PK_DATE=$(TZ=Asia/Karachi date +%Y-%m-%d)

          git commit -m "chore: update fuel prices $PK_DATE"

          # Retry push in case another workflow/process updates main.
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              echo "Pushed on attempt $i."
              exit 0
            fi

            echo "Push attempt $i failed, retrying..."
            sleep $((RANDOM % 10 + 5))
          done

          echo "All push attempts failed."
          exit 1

      - name: Show the latest recorded date
        if: always()
        run: |
          python - <<'PY'
          import json
          import pathlib

          for name in ("rates.json", "octane.json", "lpg.json"):
              p = pathlib.Path(name)

              if p.exists():
                  rows = json.loads(p.read_text())

                  if rows:
                      print(
                          f"{name}: {len(rows)} rows, "
                          f"latest {rows[-1]['date']}"
                      )
                  else:
                      print(f"{name}: file exists but contains no rows")
              else:
                  print(f"{name}: not created yet")
          PY
